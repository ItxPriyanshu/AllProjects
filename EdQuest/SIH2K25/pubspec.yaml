name: sih_2k25
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lottie: ^3.3.1  
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.1
  http: ^1.1.0
  easy_localization: ^3.0.7
  fl_chart: ^1.1.0
  auto_size_text: ^3.0.0
  url_launcher: ^6.3.0
  flutter_inappwebview: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  google_nav_bar: ^5.0.7
  badges: ^3.1.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/aiguru/
    - assets/fonts/
    - assets/translations/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
