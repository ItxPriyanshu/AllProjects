<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Report Analyzer</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eaf4ff;
    }

    .chat-container::-webkit-scrollbar {
      width: 6px;
    }

    .chat-container::-webkit-scrollbar-thumb {
      background: #60a5fa;
      border-radius: 6px;
    }
  </style>
</head>

<body class="w-screen h-screen bg-[#eaf4ff]">

<div class="bg-white w-full h-full flex flex-col p-4">

  <!-- Header -->
  <div class="flex items-center justify-between border-b pb-4 relative">

    <div class="flex items-center">
      <div class="w-10 h-10 bg-blue-400 border-2 border-black rounded-full flex items-center justify-center text-xl font-bold animate-pulse">
        📋
      </div>

      <div class="ml-3">
        <h2 class="text-lg font-semibold text-gray-800">Medical Report Analyzer</h2>
        <p class="text-xs text-green-500">Report Analyzer</p>
      </div>
    </div>
  </div>

  <!-- Chat History -->
  <div id="chat-history" class="flex-grow overflow-y-auto py-4 space-y-4 chat-container">

    <div class="flex justify-start">
      <div class="bg-blue-50 p-4 rounded-lg max-w-xs text-gray-800 shadow leading-relaxed text-sm">
        <strong>Upload your medical report 📄</strong><br><br>
        Supported formats:<br>
        • Image (JPG, PNG)<br>
        • PDF<br><br>
        I will systematically organize the clinical information from your report.
      </div>
    </div>

  </div>
<div class="pt-4 border-t flex justify-center">
  <button
    onclick="selectReport()"
    class="bg-blue-100 px-6 py-3 rounded-xl text-sm hover:bg-blue-200 transition">
    🗒️ Select Report
  </button>
</div>

</div>

<script>

const uploadForm = document.getElementById("upload-form");
const chatHistory = document.getElementById("chat-history");
function selectReport() {
  if (window.FilePickerChannel) {
    FilePickerChannel.postMessage("pickFile");
  }
}


const FILE_BACKEND_URL = "https://team-orbital.onrender.com/home/gemini";

function appendMessage(sender, message) {

  const wrapper = document.createElement("div");
  wrapper.className = sender === "user"
    ? "flex justify-end"
    : "flex justify-start";

  const bubble = document.createElement("div");
  bubble.className = sender === "user"
    ? "bg-blue-400 text-white p-3 rounded-lg max-w-xs shadow text-sm"
    : "bg-gray-100 text-gray-700 p-3 rounded-lg max-w-xs shadow text-sm";

  bubble.innerHTML = message.replace(/\n/g, "<br>");
  wrapper.appendChild(bubble);
  chatHistory.appendChild(wrapper);

  chatHistory.scrollTop = chatHistory.scrollHeight;
}


</script>

</body>
</html>
